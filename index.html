<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Planify — Daily & Weekly Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Lora:wght@500;600;700&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#FFF8EC;--card:#FFF7F1;--surface:#FFFEFA;--pink:#F9D5E5;--rose:#EE9DC0;--peach:#FFE6D6;--lav:#F7DCEA;--mint:#FBDDE9;--butter:#FFF1CC;--ink:#5B3A48;--muted:#A07C8B;--border:#F2CFDD;--radius:16px;--shadow:0 6px 16px rgba(229,138,176,.22);--m:56px}
html{overflow-x:hidden}
body{font-family:'Plus Jakarta Sans',sans-serif;color:var(--ink);min-height:100vh;padding:24px 20px 60px;overflow-x:hidden;background:linear-gradient(135deg,#FFF1F6,#FFF8EC 40%,#FFEFF5 70%,#FFF6E6) fixed}
body::before{content:"";position:fixed;top:0;left:0;right:0;bottom:0;pointer-events:none;z-index:0;background-image:radial-gradient(circle,#f6b6d2 0 1.5px,transparent 2px),radial-gradient(circle,#ffe0a3 0 1.5px,transparent 2px),radial-gradient(circle,#fff 0 2px,transparent 2.5px);background-size:97px 97px,131px 131px,71px 71px;background-position:12px 30px,60px 90px,30px 50px;animation:tw 3s ease-in-out infinite alternate}
@keyframes tw{from{opacity:.3}to{opacity:1}}
h1,h2,h3,h4{font-family:'Lora',serif}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:inherit;font-size:14px;color:var(--ink)}
::placeholder{color:var(--muted)}
:focus-visible{outline:2px solid var(--rose);outline-offset:2px}
.header,.notebook{position:relative;z-index:1}
.header{max-width:1200px;margin:0 auto 18px;text-align:center}
.theme-btn{display:none}
.header h1{font-family:'Caveat',cursive;font-size:58px;line-height:1;background:linear-gradient(90deg,#e58ab0,#f9c9dd,#e0a96d,#f9c9dd,#e58ab0);background-size:250%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 7s linear infinite}
@keyframes shine{to{background-position:250% 0}}
.greet{color:var(--muted);font-size:14px;margin-top:2px}
.view-toggle{display:inline-flex;background:var(--card);border:1.5px solid var(--border);border-radius:999px;padding:4px;margin-top:14px;box-shadow:var(--shadow)}
.view-toggle button{padding:9px 26px;border-radius:999px;font-size:14px;font-weight:700;color:var(--muted);transition:.25s}
.view-toggle button.active{background:linear-gradient(135deg,#fbd3e4,#ee9dc0);color:#5B3A48;box-shadow:0 3px 10px rgba(238,157,192,.5)}
.date-nav{display:flex;justify-content:center;align-items:center;gap:10px;margin-top:14px;flex-wrap:wrap}
.date-nav button,.utility button{background:linear-gradient(180deg,#fff,#fde6ef);border:1.5px solid var(--border);border-radius:12px;padding:8px 14px;font-size:13px;font-weight:700;box-shadow:var(--shadow);transition:.2s}
.date-nav button:hover{background:var(--pink);transform:translateY(-1px)}
#dateLabel{font-family:'Caveat',cursive;font-weight:700;font-size:30px}
#weekSummary{font-size:13px;color:var(--muted);margin-top:4px;min-height:18px}
.utility{display:flex;justify-content:center;gap:8px;margin-top:10px;flex-wrap:wrap}
.utility button{padding:6px 12px;font-size:12px;color:var(--muted);box-shadow:none}
.utility button:hover{color:var(--ink);background:var(--butter)}

/* notebook */
.tabs{max-width:1200px;margin:0 auto -2px;display:flex;justify-content:flex-end;gap:6px;padding-right:18px;position:relative;z-index:6}
.tab{padding:7px 16px;border-radius:12px 12px 0 0;background:linear-gradient(180deg,#fbd3e4,#f4b9d1);border:1.5px solid #efb0c9;border-bottom:none;font-weight:700;font-size:12px;color:#8a4a63;transform:translateY(4px);transition:.2s}
.tab:hover{transform:translateY(1px)}
.tab.active{background:#FFFBF0;transform:none;padding-top:10px;color:var(--ink)}
.notebook{max-width:1200px;margin:0 auto}
.spiral{position:absolute;left:-14px;top:16px;bottom:16px;width:48px;z-index:5;pointer-events:none;background-image:linear-gradient(180deg,transparent 9px,#c88aa5 9px,#fff 12px,#e7b3c9 15px,#b97593 17px,transparent 17px);background-size:48px 30px;filter:drop-shadow(1px 2px 1px rgba(150,80,110,.3))}
.page{--m:56px;position:relative;transform-origin:left center;border-radius:6px 20px 20px 6px;padding:26px 22px 28px calc(var(--m) + 18px);border:1.5px solid #f3cfdd;background-color:#FFFBF0;
  box-shadow:3px 3px 0 #fff3f7,6px 6px 0 #f6d5e2,9px 9px 0 #fff3f7,12px 12px 0 #f3c9da,0 20px 40px rgba(229,138,176,.25);
  background-image:linear-gradient(90deg,transparent calc(var(--m) - 1px),rgba(229,138,176,.55) calc(var(--m) - 1px),rgba(229,138,176,.55) calc(var(--m) + 1px),transparent calc(var(--m) + 1px)),repeating-linear-gradient(180deg,transparent 0 31px,rgba(244,169,200,.3) 31px 32px)}
.page[data-paper=dotted]{background-image:linear-gradient(90deg,transparent calc(var(--m) - 1px),rgba(229,138,176,.55) calc(var(--m) - 1px),rgba(229,138,176,.55) calc(var(--m) + 1px),transparent calc(var(--m) + 1px)),radial-gradient(rgba(229,138,176,.5) 1.3px,transparent 1.7px);background-size:auto,24px 24px}
.page[data-paper=grid]{background-image:linear-gradient(90deg,transparent calc(var(--m) - 1px),rgba(229,138,176,.55) calc(var(--m) - 1px),rgba(229,138,176,.55) calc(var(--m) + 1px),transparent calc(var(--m) + 1px)),linear-gradient(rgba(244,169,200,.28) 1px,transparent 1px),linear-gradient(90deg,rgba(244,169,200,.28) 1px,transparent 1px);background-size:auto,26px 26px,26px 26px}
.page::after{content:"";position:absolute;top:0;left:0;right:0;bottom:0;border-radius:inherit;pointer-events:none;background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.55) 50%,transparent 60%);background-size:260% 100%;animation:gloss 9s ease-in-out infinite}
@keyframes gloss{0%{background-position:130% 0}60%,100%{background-position:-60% 0}}
.out-next{animation:outN .38s ease-in forwards}
@keyframes outN{to{transform:perspective(1500px) rotateY(-100deg);opacity:.15}}
.in-next{animation:inN .4s ease-out}
@keyframes inN{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:none}}
.out-prev{animation:outP .2s forwards}
@keyframes outP{to{opacity:0}}
.in-prev{animation:inP .45s ease-out}
@keyframes inP{from{transform:perspective(1500px) rotateY(-100deg);opacity:.15}to{transform:none;opacity:1}}

.daily-layout{display:grid;grid-template-columns:1fr 390px;gap:24px}
.weekly-layout{display:none;grid-template-columns:repeat(7,minmax(0,1fr));gap:12px}
.col{display:flex;flex-direction:column;gap:22px}
@media(max-width:1100px){.daily-layout{grid-template-columns:1fr}.weekly-layout{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:600px){.page{--m:24px;padding:22px 12px 24px calc(var(--m) + 14px)}.weekly-layout{grid-template-columns:1fr}.header h1{font-size:48px}.spiral{left:-12px;width:40px}.tabs{justify-content:center;padding:0}.tab{padding:7px 11px}}

/* highlighted cards */
.card,.day-card{position:relative;background:linear-gradient(145deg,#FFFDF8,#FFF1F6 55%,#FFF6E8);border:1.5px solid #f2bcd3;border-radius:var(--radius);padding:18px;box-shadow:0 0 0 4px rgba(249,213,229,.55),0 10px 22px rgba(229,138,176,.28);transition:.25s}
.card::before,.day-card::before{content:"";position:absolute;top:-12px;left:50%;width:92px;height:22px;transform:translateX(-50%) rotate(-2deg);background:repeating-linear-gradient(45deg,rgba(249,190,215,.9) 0 8px,rgba(255,243,214,.95) 8px 16px);border-radius:3px;box-shadow:0 2px 4px rgba(150,80,110,.15)}
.col .card:nth-child(even)::before{transform:translateX(-50%) rotate(2deg);width:76px}
.card:hover{box-shadow:0 0 0 4px rgba(244,169,200,.7),0 14px 28px rgba(229,138,176,.38)}
.card h3{font-family:'Caveat',cursive;font-size:25px;font-weight:700;margin:6px 0 12px;display:flex;align-items:center;gap:8px;cursor:pointer;padding:0 8px;border-radius:6px;background:linear-gradient(transparent 58%,rgba(244,169,200,.6) 58%)}
.card h3::after{content:"▾";margin-left:auto;font-size:12px;opacity:.5}
.card.closed h3::after{content:"▸"}
.card.closed>*:not(h3){display:none}
.progress h3::after,.timer h3::after{display:none}
.card h3 small{font-family:'Plus Jakarta Sans',sans-serif;font-size:11px;color:var(--muted);font-weight:500}
.progress{display:flex;align-items:center;gap:18px;background:linear-gradient(135deg,#fbd3e4,#fff0d9 90%)}
.progress h3{margin:0 0 4px}
.progress p{font-size:13px;opacity:.85}
.ring{position:relative;width:84px;height:84px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:8;stroke-linecap:round}
.ring .bg{stroke:rgba(255,255,255,.7)}
.ring .fg{stroke:#d9608f;stroke-dasharray:213.6;stroke-dashoffset:213.6;transition:stroke-dashoffset .7s cubic-bezier(.4,1.4,.6,1)}
.ring b{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;font-size:18px;font-family:'Lora',serif}
.sticky{background:linear-gradient(145deg,#FFF3C9,#FFE6EF)}
#affirm{font-family:'Caveat',cursive;font-size:25px;line-height:1.2;text-align:center;padding:6px 4px 12px}

.timeline{display:flex;flex-direction:column;gap:6px}
.slot{display:flex;align-items:center;gap:10px;background:rgba(255,254,250,.9);border:1px solid var(--border);border-radius:12px;padding:10px 12px;cursor:pointer;transition:.2s;min-height:46px}
.slot:hover{background:var(--pink);transform:translateX(3px)}
.slot.now{border-color:var(--rose);box-shadow:0 0 0 3px rgba(238,157,192,.4)}
.slot.now .time::after{content:" • now";color:#d9608f}
.slot.filled{border-left:5px solid var(--rose);background:#fff0f6}
.slot .time{font-size:12px;font-weight:700;color:var(--muted);min-width:78px}
.slot .event{flex:1;font-size:13px;word-break:break-word}
.slot .add{color:var(--muted);opacity:.7}
.slot .del{opacity:.5;font-size:14px;padding:4px}
.slot .del:hover{opacity:1}
.moods{display:flex;gap:8px;flex-wrap:wrap}
.mood-btn{flex:1;min-width:60px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:10px 4px;font-size:11px;font-weight:700;color:var(--muted);transition:.2s}
.mood-btn .mi{font-size:22px;display:block;margin-bottom:4px;transition:.2s}
.mood-btn:hover .mi{transform:scale(1.25)}
.mood-btn.active{border-color:var(--rose);box-shadow:0 0 0 3px rgba(238,157,192,.4);color:var(--ink);background:var(--pink)}
textarea{width:100%;padding:10px;border:1px solid var(--border);border-radius:10px;background:var(--surface);resize:vertical;line-height:1.5;font-size:13px}
#moodNote{margin-top:10px;min-height:50px}
#dailyNotes{min-height:100px}
.item{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px dashed #efbcd2;animation:pop .3s}
.item:last-child{border-bottom:none}
@keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
.item input[type=checkbox]{width:18px;height:18px;accent-color:#e58ab0;cursor:pointer;flex:none}
.item .txt{flex:1;font-size:13px;transition:.3s;word-break:break-word}
.item input:checked+.txt{text-decoration:line-through;color:var(--muted)}
.item .btn{font-size:12px;opacity:.55;padding:4px}
.item .btn:hover{opacity:1}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.p-high{background:#e0558a}.p-med{background:#f2b84b}.p-low{background:#bfa6b0}
.empty{font-size:13px;color:var(--muted);padding:10px 0;text-align:center}
.add-row{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.add-row input{flex:1;min-width:110px;padding:9px 10px;border:1px solid var(--border);border-radius:10px;background:var(--surface)}
.go{background:linear-gradient(135deg,#fbd3e4,#ee9dc0);border-radius:10px;padding:8px 14px;font-weight:700;transition:.2s;color:#5B3A48;box-shadow:0 3px 8px rgba(238,157,192,.4)}
.go:hover{transform:scale(1.07)}
select{padding:8px;border:1px solid var(--border);border-radius:10px;background:var(--surface);font-size:12px}
.filters{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.chip{padding:5px 12px;border-radius:999px;font-size:12px;font-weight:700;background:var(--surface);border:1px solid var(--border);color:var(--muted);transition:.2s}
.chip.active,.chip:hover{background:var(--pink);color:var(--ink);border-color:#f2bcd3}
.filters input{flex:1;min-width:90px;padding:5px 10px;border:1px solid var(--border);border-radius:999px;background:var(--surface);font-size:12px}
.meal{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.meal label{width:78px;font-size:12px;font-weight:700;color:var(--muted)}
.meal input{flex:1;padding:8px 10px;border:1px solid var(--border);border-radius:10px;background:var(--surface)}
.glasses{display:flex;gap:6px;margin-bottom:12px}
.glass{flex:1;height:38px;border-radius:8px 8px 14px 14px;background:var(--surface);border:1px solid var(--border);font-size:16px;transition:.2s;opacity:.55}
.glass.full{background:linear-gradient(180deg,#ffe3ef,#f4a9c8);border-color:#f2a0c0;opacity:1;transform:translateY(-2px)}
.habits{display:flex;gap:8px;flex-wrap:wrap}
.habit{flex:1;min-width:60px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:10px 4px;font-size:11px;font-weight:700;color:var(--muted);transition:.2s}
.habit .hi{font-size:20px;display:block;margin-bottom:4px}
.habit.done{background:linear-gradient(135deg,#fbd3e4,#fff0d9);border-color:#f2a0c0;color:var(--ink)}
.habit:hover{transform:translateY(-2px)}
.timer{text-align:center}
.timer h3{justify-content:center}
#timeLeft{font-family:'Lora',serif;font-size:46px;font-weight:700;margin:4px 0 10px}
.timer .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.day-card{padding:16px 12px 12px;display:flex;flex-direction:column;min-height:300px}
.day-card.today{border-color:#e58ab0;background:linear-gradient(145deg,#fff6e0,#ffe3ee)}
.day-card h4{font-family:'Caveat',cursive;font-size:24px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;margin-top:4px}
.day-card h4:hover{color:#d9608f}
.bar{height:7px;background:#f6dbe6;border-radius:9px;margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#ee9dc0,#f4c97a);border-radius:9px;transition:width .5s}
.day-card .tasks{flex:1;margin:10px 0;display:flex;flex-direction:column;gap:6px;overflow-y:auto;max-height:240px}
.mini-task{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:6px 8px;font-size:12px;cursor:grab}
.mini-task.dragging{opacity:.4}
.mini-task input{width:14px;height:14px;accent-color:#e58ab0}
.mini-task span.t{flex:1;word-break:break-word}
.mini-task span.done{text-decoration:line-through;color:var(--muted)}
.mini-task .mv{opacity:.5;font-size:12px;padding:2px 4px}
.mini-task .mv:hover{opacity:1}
.day-card .add-row input{font-size:12px;padding:6px 8px;min-width:50px}
.day-card .go{padding:6px 10px}
.drop-hover{background:var(--butter)!important}
.tag{display:inline-block;padding:2px 8px;border-radius:8px;font-size:10px;font-weight:700;color:var(--ink)}
.tag-work{background:#f9c9dd}.tag-personal{background:#ffe9c9}.tag-wellness{background:#fde2ee}.tag-study{background:#fff3cc}.tag-other{background:#f3d4e4}
.modal-bg{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(120,60,90,.35);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);z-index:100;align-items:center;justify-content:center;padding:16px}
.modal-bg.show{display:flex}
.modal{background:linear-gradient(145deg,#FFFDF8,#FFEFF5);border:1.5px solid #f2bcd3;border-radius:20px;padding:22px;width:100%;max-width:380px;box-shadow:0 14px 50px rgba(150,60,100,.3);animation:pop .25s}
.modal h3{margin-bottom:14px;font-size:26px;font-family:'Caveat',cursive}
.modal input,.modal select{width:100%;padding:10px;border:1px solid var(--border);border-radius:10px;background:var(--surface);margin-bottom:10px;font-size:14px}
.btn-row{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}
.btn-row button{padding:9px 18px;border-radius:10px;font-weight:700;font-size:13px}
.btn-row .save{background:linear-gradient(135deg,#fbd3e4,#ee9dc0);color:#5B3A48}
.btn-row .cancel{background:var(--surface);border:1px solid var(--border);color:var(--muted)}
#toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,80px);background:#7a4560;color:#fff7fa;padding:10px 20px;border-radius:999px;font-size:13px;font-weight:600;opacity:0;transition:.35s;z-index:200;max-width:90vw;text-align:center}
#toast.show{transform:translate(-50%,0);opacity:1}
#confetti{position:fixed;top:0;left:0;right:0;bottom:0;pointer-events:none;z-index:150}
.study-layout{display:none;grid-template-columns:1fr 1fr;gap:24px;align-items:start}
@media(max-width:1100px){.study-layout{grid-template-columns:1fr}}
.study-layout .card h3{cursor:default}
.study-layout .card h3::after{display:none}
.hint{font-size:12px;color:var(--muted);line-height:1.5;margin:8px 0}
.subj{border:1px solid var(--border);border-left:6px solid var(--c);border-radius:12px;padding:10px;margin-top:12px;background:var(--surface)}
.subj h4{display:flex;gap:8px;align-items:center;font-size:15px}
.subj h4 span{flex:1}
.subj h4 small{color:var(--muted);font-size:11px;font-family:'Plus Jakarta Sans',sans-serif}
.cd{padding:2px 10px;border-radius:999px;font-size:11px;background:var(--pink)}
.cd.hot{background:#f7a4c0}
.cdrow{margin-bottom:12px}
.cdrow .top{display:flex;gap:8px;align-items:center;font-size:13px;font-weight:700}
.cdrow .top span{flex:1}
.set{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.set label{font-size:12px;font-weight:700;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.set input,.add-row input[type=date]{padding:9px;border:1px solid var(--border);border-radius:10px;background:var(--surface)}
.logbars{display:flex;align-items:flex-end;gap:6px;height:90px;margin:12px 0 4px}
.logbars div{flex:1;height:100%;text-align:center;font-size:10px;color:var(--muted);display:flex;flex-direction:column;justify-content:flex-end}
.logbars i{display:block;background:linear-gradient(180deg,#f4c97a,#ee9dc0);border-radius:6px 6px 2px 2px;min-height:3px}
.seg{display:flex;flex-wrap:wrap;gap:6px;width:100%}
.seg button{padding:8px 13px;border-radius:999px;font-size:12px;font-weight:700;background:var(--surface);border:1px solid var(--border);color:var(--muted)}
.seg button.on{background:var(--pink);color:var(--ink);border-color:#f2a0c0}
.modal .seg{margin-bottom:12px}
.add-row .seg{flex-basis:100%}
@media(pointer:coarse){input,textarea{font-size:16px!important}button{touch-action:manipulation}}
</style>
</head>
<body>

<div class="header">
  <button class="theme-btn" id="themeBtn" aria-label="Toggle dark mode">🌙</button>
  <h1>Planify ☁️</h1>
  <p class="greet" id="greet"></p>
  <div class="view-toggle">
    <button id="btnDaily" class="active">Daily</button>
    <button id="btnWeekly">Weekly</button>
    <button id="btnStudy">Study</button>
  </div>
  <div class="date-nav">
    <button id="prevBtn">← Prev</button>
    <button id="todayBtn">Today</button>
    <button id="nextBtn">Next →</button>
  </div>
  <div class="date-nav" style="margin-top:10px"><span id="dateLabel"></span></div>
  <p id="weekSummary"></p>
  <div class="utility">
    <button id="clearDone">Clear completed</button>
    <button id="resetBtn">Reset day/week</button>
    <button id="exportBtn">Save backup</button>
    <button id="importBtn">Load backup</button>
    <button id="paperBtn">Paper: ruled</button>
    <input type="file" id="importFile" accept=".json" hidden>
  </div>
</div>

<div class="tabs" id="tabs"></div>
<div class="notebook"><div class="spiral"></div><div class="page" id="page">
<!-- DAILY -->
<div class="daily-layout" id="dailyView">
  <div class="card">
    <h3>🕰️ Hourly schedule <small>6 AM – 10 PM · tap a slot</small></h3>
    <div class="timeline" id="timeline"></div>
  </div>
  <div class="col">
    <div class="card progress">
      <div class="ring">
        <svg width="84" height="84" viewBox="0 0 84 84"><circle class="bg" cx="42" cy="42" r="34"/><circle class="fg" id="ringFg" cx="42" cy="42" r="34"/></svg>
        <b id="pct">0%</b>
      </div>
      <div><h3>Today's progress</h3><p id="progMsg"></p><p id="progHabits"></p></div>
    </div>
    <div class="card">
      <h3>💌 Mood check-in</h3>

      <h3>⭐ Top 3 priorities</h3>

    <div class="card">
      <h3>📝 To-do list</h3>
      <div class="filters">
        <button class="chip active" data-f="all">All</button>
        <button class="chip" data-f="active">Active</button>
        <button class="chip" data-f="done">Done</button>

      <div id="todoList"></div>

        <div class="seg" id="todoCat" data-v="work"></div>

      <h3>💧 Water & habits <small id="waterCount"></small></h3>

    <div class="card timer">
      <h3 style="justify-content:center">🍅 Focus timer</h3>
      <div class="filters" style="justify-content:center">
        <button class="chip active" data-m="25">Focus 25</button>
        <button class="chip" data-m="5">Break 5</button>
        <button class="chip" data-m="15">Long 15</button>
      </div>
      <div id="timeLeft">25:00</div>
      <div class="row"><button class="go" id="timerGo">Start</button><button class="chip" id="timerReset">Reset</button></div>
    </div>

      <h3>🍓 Meals</h3>
      <div class="meal"><label>Breakfast</label><input id="meal_b" placeholder="breakfast plan..."></div>
      <div class="meal"><label>Lunch</label><input id="meal_l" placeholder="lunch plan..."></div>
      <div class="meal"><label>Dinner</label><input id="meal_d" placeholder="dinner plan..."></div>

      <h3>💖 Today's affirmation</h3>

<div class="weekly-layout" id="weeklyView"></div>
<div class="study-layout" id="studyView"></div>
</div></div>

<!-- MODAL -->
<div class="modal-bg" id="modalBg">
  <div class="modal">
    <h3 id="mTitle"></h3>
    <input id="mText" placeholder="Type here...">
    <div class="seg" id="mCat" data-v="work"></div>
    <div class="seg" id="mPri" data-v="med"></div>
    <div class="btn-row"><button class="cancel" id="mCancel">Cancel</button><button class="save" id="mSave">Save</button></div>
  </div>
</div>
<div id="toast"></div>
<canvas id="confetti"></canvas>

<script>
/* ===== helpers ===== */
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const dayKey=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const hourLabel=h=>((h%12)||12)+(h<12?' AM':' PM');
let tt;function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2400)}

/* ===== state ===== */
const KEY='planify_v2';
let state={};
try{state=JSON.parse(localStorage.getItem(KEY)||localStorage.getItem('planify_v1')||'{}')}catch(e){state={}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
function getData(k){
  const d=state[k]||(state[k]={});
  d.events=d.events||{};d.meals=d.meals||{};d.mood=d.mood||null;d.moodNote=d.moodNote||'';d.todos=d.todos||[];d.habits=d.habits||{};d.notes=d.notes||'';d.water=d.water||0;
  let p=(Array.isArray(d.prios)?d.prios:[]).map(x=>typeof x==='string'?{text:x,done:false}:x);
  while(p.length<3)p.push({text:'',done:false});
  d.prios=p;return d;
}
function stats(d){const it=[...d.todos,...d.prios.filter(p=>p.text)];const done=it.filter(i=>i.done).length;return{total:it.length,done,pct:it.length?Math.round(done/it.length*100):0}}

let current=new Date();current.setHours(0,0,0,0);
let view='daily',tFilter='all',tQuery='',lastKey='',lastPct=0;
const MOODS=[['happy','😊','Radiant'],['calm','🌿','Content'],['neutral','☁️','Neutral'],['tired','🌙','Tired'],['stressed','🌊','Anxious']];
const HABITS=[['move','🏃','Move'],['read','📖','Read'],['sleep','😴','Sleep'],['selfcare','🛁','Self-care'],['outside','🌳','Outside']];

/* ===== theme ===== */
function setTheme(t){document.documentElement.dataset.theme=t;$('themeBtn').textContent=t==='dark'?'☀️':'🌙';try{localStorage.setItem('planify_theme',t)}catch(e){}}
setTheme('light');
$('themeBtn').onclick=()=>setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');

/* ===== tap-button choosers (replace dropdowns) ===== */
const CATS=[['work','Work'],['personal','Personal'],['wellness','Wellness'],['study','Study'],['other','Other']],PRIS=[['high','🔴 High'],['med','🟡 Medium'],['low','🟢 Low']];
function setSeg(id,v){const el=$(id);el.dataset.v=v;[...el.children].forEach(b=>b.classList.toggle('on',b.dataset.v===v))}
function seg(id,opts){const el=$(id);el.innerHTML='';opts.forEach(([v,l])=>{const b=document.createElement('button');b.type='button';b.dataset.v=v;b.textContent=l;b.onclick=()=>setSeg(id,v);el.appendChild(b)});setSeg(id,el.dataset.v)}
seg('todoCat',CATS);seg('todoPri',PRIS);seg('mCat',CATS);seg('mPri',PRIS);

/* ===== modal ===== */
let modalCfg=null;
function openModal(c){
  modalCfg=c;$('mTitle').textContent=c.title;$('mText').value=c.text||'';setSeg('mCat',c.cat||'other');setSeg('mPri',c.pri||'med');
  $('mCat').style.display=c.showCat===false?'none':'block';$('mPri').style.display=c.showPri?'block':'none';
  $('modalBg').classList.add('show');setTimeout(()=>$('mText').focus(),50);
}
function closeModal(){$('modalBg').classList.remove('show')}
function submitModal(){const t=$('mText').value.trim();if(!t)return toast('Please type something first');modalCfg.onSave(t,$('mCat').dataset.v,$('mPri').dataset.v);closeModal()}
$('mSave').onclick=submitModal;$('mCancel').onclick=closeModal;
$('modalBg').onclick=e=>{if(e.target.id==='modalBg')closeModal()};
$('mText').onkeydown=e=>{if(e.key==='Enter')submitModal()};
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});

/* ===== view + nav ===== */
function switchView(v){
  view=v;[['daily','Daily'],['weekly','Weekly'],['study','Study']].forEach(([x,X])=>{$('btn'+X).classList.toggle('active',v===x);$(x+'View').style.display=v===x?'grid':'none'});render();
}
$('btnDaily').onclick=()=>switchView('daily');$('btnWeekly').onclick=()=>switchView('weekly');$('btnStudy').onclick=()=>switchView('study');
const step=n=>flip(n,()=>{current.setDate(current.getDate()+n*(view!=='daily'?7:1));render()});
$('prevBtn').onclick=()=>step(-1);$('nextBtn').onclick=()=>step(1);
$('todayBtn').onclick=()=>{if(view!=='daily'){const t=new Date();t.setHours(0,0,0,0);if(mon(t)!==mon(current))flip(t>current?1:-1,()=>{current=t;render()})}else goTo(new Date())};

function render(){
  const h=new Date().getHours();
  $('greet').textContent=(h<12?'Good morning':h<18?'Good afternoon':'Good evening')+' ✨ your soft little life planner';
  if(view==='weekly')renderWeekly();else if(view==='study')renderStudy();else{renderDaily();renderTimeline()}
  renderTabs();save();
}

/* ===== daily ===== */
function renderDaily(){
  const k=dayKey(current),d=getData(k);
  $('dateLabel').textContent=current.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'});
  $('weekSummary').textContent='';
  // progress
  const s=stats(d),hc=HABITS.filter(h=>d.habits[h[0]]).length;
  $('ringFg').style.strokeDashoffset=213.6*(1-s.pct/100);$('pct').textContent=s.pct+'%';
  $('progMsg').textContent=s.total?s.done+' of '+s.total+' tasks done':'Add a task to get started';
  $('progHabits').textContent=hc+' of '+HABITS.length+' habits · '+d.water+' glasses of water';
  if(lastKey===k&&s.total>0&&s.pct===100&&lastPct<100)confetti();
  lastKey=k;lastPct=s.pct;
  // moods
  const me=$('moods');me.innerHTML='';
  MOODS.forEach(([id,em,lb])=>{
    const b=document.createElement('button');b.className='mood-btn'+(d.mood===id?' active':'');
    b.innerHTML=`<span class="mi">${em}</span>${lb}`;
    b.onclick=()=>{d.mood=d.mood===id?null:id;render()};me.appendChild(b);
  });
  $('moodNote').value=d.moodNote;$('dailyNotes').value=d.notes;['b','l','d'].forEach(m=>$('meal_'+m).value=d.meals[m]||'');
  // priorities
  const pl=$('prioList');pl.innerHTML='';
  d.prios.forEach(p=>{
    const r=document.createElement('div');r.className='item';
    r.innerHTML=`<input type="checkbox" ${p.done?'checked':''} ${p.text?'':'disabled'}><span class="txt" ${p.text?'':'style="color:var(--muted)"'}>${p.text?esc(p.text):'empty — tap ✏️ to set'}</span><button class="btn">✏️</button>`;
    r.querySelector('input').onchange=e=>{p.done=e.target.checked;render()};
    r.querySelector('.btn').onclick=()=>openModal({title:'Edit priority',text:p.text,showCat:false,onSave:t=>{p.text=t;render()}});
    pl.appendChild(r);
  });
  // todos
  const tl=$('todoList');tl.innerHTML='';
  const list=d.todos.map((t,i)=>({t,i})).filter(({t})=>(tFilter==='all'||(tFilter==='done')===!!t.done)&&t.text.toLowerCase().includes(tQuery));
  if(!list.length)tl.innerHTML='<div class="empty">'+(d.todos.length?'No tasks match this filter.':'Nothing here yet — add your first task ✨')+'</div>';
  list.forEach(({t,i})=>{
    const r=document.createElement('div');r.className='item';
    r.innerHTML=`<input type="checkbox" ${t.done?'checked':''}><span class="dot p-${t.pri||'med'}" title="${t.pri||'med'} priority"></span><span class="txt">${esc(t.text)}</span><span class="tag tag-${t.cat}">${t.cat}</span><button class="btn e">✏️</button><button class="btn x">🗑️</button>`;
    r.querySelector('input').onchange=e=>{t.done=e.target.checked;render()};
    r.querySelector('.e').onclick=()=>openModal({title:'Edit task',text:t.text,cat:t.cat,pri:t.pri,showPri:true,onSave:(x,c,p)=>{t.text=x;t.cat=c;t.pri=p;render()}});
    r.querySelector('.x').onclick=()=>{d.todos.splice(i,1);toast('Task deleted');render()};
    tl.appendChild(r);
  });
  // water + habits
  $('waterCount').textContent=d.water+' / 8 glasses';
  const g=$('glasses');g.innerHTML='';
  for(let i=0;i<8;i++){const b=document.createElement('button');b.className='glass'+(i<d.water?' full':'');b.textContent='💧';b.onclick=()=>{d.water=d.water===i+1?i:i+1;render()};g.appendChild(b)}
  const hb=$('habits');hb.innerHTML='';
  HABITS.forEach(([id,em,lb])=>{
    const b=document.createElement('button');b.className='habit'+(d.habits[id]?' done':'');
    b.innerHTML=`<span class="hi">${em}</span>${lb}`;b.onclick=()=>{d.habits[id]=!d.habits[id];render()};hb.appendChild(b);
  });
}
function renderTimeline(){
  const d=getData(dayKey(current)),tl=$('timeline');tl.innerHTML='';
  const now=new Date(),isToday=dayKey(now)===dayKey(current);
  for(let h=6;h<=22;h++){
    const ev=d.events[h],s=document.createElement('div');
    s.className='slot'+(ev?' filled':'')+(isToday&&now.getHours()===h?' now':'');
    s.innerHTML=`<span class="time">${hourLabel(h)}</span><span class="event">${ev?esc(ev.text)+' <span class="tag tag-'+ev.cat+'">'+ev.cat+'</span>':'<span class="add">+ add</span>'}</span>${ev?'<button class="del">🗑️</button>':''}`;
    s.onclick=()=>openModal({title:'Schedule — '+hourLabel(h),text:ev?ev.text:'',cat:ev?ev.cat:'work',onSave:(t,c)=>{d.events[h]={text:t,cat:c};render()}});
    if(ev)s.querySelector('.del').onclick=e=>{e.stopPropagation();delete d.events[h];toast('Event removed');render()};
    tl.appendChild(s);
  }
}

/* ===== add handlers ===== */
function addPrio(){const v=$('prioInput').value.trim();if(!v)return;const d=getData(dayKey(current));const i=d.prios.findIndex(p=>!p.text);if(i>=0)d.prios[i]={text:v,done:false};else d.prios.push({text:v,done:false});$('prioInput').value='';render()}
function addTodo(){const v=$('todoInput').value.trim();if(!v)return;getData(dayKey(current)).todos.push({text:v,cat:$('todoCat').dataset.v,pri:$('todoPri').dataset.v,done:false});$('todoInput').value='';toast('Task added ✨');render()}
$('prioAdd').onclick=addPrio;$('todoAdd').onclick=addTodo;
$('prioInput').onkeydown=e=>{if(e.key==='Enter')addPrio()};$('todoInput').onkeydown=e=>{if(e.key==='Enter')addTodo()};
$('moodNote').oninput=e=>{getData(dayKey(current)).moodNote=e.target.value;save()};
$('dailyNotes').oninput=e=>{getData(dayKey(current)).notes=e.target.value;save()};
document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{tFilter=b.dataset.f;document.querySelectorAll('[data-f]').forEach(x=>x.classList.toggle('active',x===b));render()});
$('todoSearch').oninput=e=>{tQuery=e.target.value.toLowerCase();render()};

/* ===== weekly ===== */
function weekStart(){const s=new Date(current);s.setDate(s.getDate()-((s.getDay()+6)%7));return s}
function renderWeekly(){
  const wl=$('weeklyView');wl.innerHTML='';
  const start=weekStart(),today=new Date();today.setHours(0,0,0,0);
  const names=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];let tot=0,dn=0;
  for(let i=0;i<7;i++){
    const date=new Date(start);date.setDate(start.getDate()+i);
    const k=dayKey(date),d=getData(k),s=stats(d);tot+=s.total;dn+=s.done;
    const card=document.createElement('div');card.className='day-card'+(date.getTime()===today.getTime()?' today':'');
    const me=d.mood?MOODS.find(m=>m[0]===d.mood)[1]:'';
    card.innerHTML=`<h4 title="Open this day">${names[i]} ${date.getDate()}<span>${me}</span></h4><div class="bar"><i style="width:${s.pct}%"></i></div><div class="tasks"></div><div class="add-row"><input placeholder="quick add..."><button class="go">+</button></div>`;
    card.querySelector('h4').onclick=()=>{current=new Date(date);switchView('daily')};
    const te=card.querySelector('.tasks');
    if(!Object.keys(d.events).length&&!d.todos.length)te.innerHTML='<div class="empty">free day 🌤️</div>';
    const next=new Date(date);next.setDate(date.getDate()+1);
    Object.entries(d.events).forEach(([h,ev])=>{
      const t=document.createElement('div');t.className='mini-task';t.draggable=true;
      t.innerHTML=`<span class="t">🕰️ ${hourLabel(+h)} · ${esc(ev.text)}</span><span class="tag tag-${ev.cat}">${ev.cat}</span><button class="mv" title="Move to next day">➡️</button>`;
      t.querySelector('.mv').onclick=()=>{const nd=getData(dayKey(next));if(nd.events[h])return toast('That time slot is taken tomorrow');nd.events[h]=ev;delete d.events[h];toast('Moved to tomorrow');render()};
      drag(t,{from:k,type:'event',hour:h});te.appendChild(t);
    });
    d.todos.forEach((t,idx)=>{
      const el=document.createElement('div');el.className='mini-task';el.draggable=true;
      el.innerHTML=`<input type="checkbox" ${t.done?'checked':''}><span class="t ${t.done?'done':''}">${esc(t.text)}</span><span class="tag tag-${t.cat}">${t.cat}</span><button class="mv" title="Move to next day">➡️</button>`;
      el.querySelector('input').onchange=e=>{t.done=e.target.checked;render()};
      el.querySelector('.mv').onclick=()=>{d.todos.splice(idx,1);getData(dayKey(next)).todos.push(t);toast('Moved to tomorrow');render()};
      drag(el,{from:k,type:'todo',idx});te.appendChild(el);
    });
    const inp=card.querySelector('input'),add=()=>{const v=inp.value.trim();if(!v)return;d.todos.push({text:v,cat:'other',pri:'med',done:false});render()};
    card.querySelector('.go').onclick=add;inp.onkeydown=e=>{if(e.key==='Enter')add()};
    card.addEventListener('dragover',e=>{e.preventDefault();card.classList.add('drop-hover')});
    card.addEventListener('dragleave',()=>card.classList.remove('drop-hover'));
    card.addEventListener('drop',e=>{
      e.preventDefault();card.classList.remove('drop-hover');
      let data;try{data=JSON.parse(e.dataTransfer.getData('text'))}catch(x){return}
      const src=getData(data.from),dest=getData(k);if(data.from===k)return;
      if(data.type==='event'){if(dest.events[data.hour])return toast('That time slot is taken');dest.events[data.hour]=src.events[data.hour];delete src.events[data.hour]}
      else dest.todos.push(src.todos.splice(Number(data.idx),1)[0]);
      render();
    });
    wl.appendChild(card);
  }
  const end=new Date(start);end.setDate(start.getDate()+6);
  $('dateLabel').textContent=start.toLocaleDateString('en-US',{month:'short',day:'numeric'})+' – '+end.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
  $('weekSummary').textContent=tot?dn+' of '+tot+' tasks done this week ('+Math.round(dn/tot*100)+'%)':'Nothing planned this week yet — add something below a day.';
}
function drag(el,info){
  el.addEventListener('dragstart',e=>{e.dataTransfer.setData('text',JSON.stringify(info));el.classList.add('dragging')});
  el.addEventListener('dragend',()=>el.classList.remove('dragging'));
}

/* ===== utilities ===== */
function daysInScope(){if(view==='daily')return[dayKey(current)];const s=weekStart();return[...Array(7)].map((_,i)=>{const d=new Date(s);d.setDate(s.getDate()+i);return dayKey(d)})}
$('clearDone').onclick=()=>{daysInScope().forEach(k=>{const d=getData(k);d.todos=d.todos.filter(t=>!t.done)});toast('Completed tasks cleared');render()};
$('resetBtn').onclick=()=>{if(!confirm('Reset this '+(view==='daily'?'day':'week')+'? This clears all its data.'))return;daysInScope().forEach(k=>delete state[k]);toast('Reset done');render()};
$('exportBtn').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state)],{type:'application/json'}));a.download='planify-backup.json';a.click();toast('Backup saved 💾')};
$('importBtn').onclick=()=>$('importFile').click();
$('importFile').onchange=e=>{
  const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const o=JSON.parse(r.result);if(typeof o!=='object'||!o)throw 0;state=o;toast('Backup loaded ✨');render()}catch(x){toast('That file is not a valid backup')}};
  r.readAsText(f);e.target.value='';
};

/* ===== focus timer ===== */
let tMode=25*60,tLeft=tMode,tInt=null;
const tShow=()=>{$('timeLeft').textContent=pad(Math.floor(tLeft/60))+':'+pad(tLeft%60)};
function tStop(){clearInterval(tInt);tInt=null;$('timerGo').textContent='Start'}
$('timerGo').onclick=()=>{
  if(tInt)return tStop();
  $('timerGo').textContent='Pause';
  tInt=setInterval(()=>{tLeft--;tShow();if(tLeft<=0){tStop();if(tMode===1500)addLog(25);tLeft=tMode;tShow();toast('⏰ Time is up! Nice work');if(navigator.vibrate)navigator.vibrate(400)}},1000);
};
$('timerReset').onclick=()=>{tStop();tLeft=tMode;tShow()};
document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{tStop();tMode=tLeft=+b.dataset.m*60;tShow();document.querySelectorAll('[data-m]').forEach(x=>x.classList.toggle('active',x===b))});

/* ===== confetti ===== */
function confetti(){
  const c=$('confetti'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;
  const cols=['#F8C8DC','#FFD8BE','#E2D4F0','#D4EFE6','#FFF3C4','#F4A9C8'];
  const ps=Array.from({length:100},()=>({x:innerWidth/2,y:innerHeight/3,vx:(Math.random()-.5)*14,vy:Math.random()*-12-2,s:Math.random()*7+5,c:cols[Math.random()*6|0],r:Math.random()*6}));
  let f=0;(function a(){
    x.clearRect(0,0,c.width,c.height);
    ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.35;p.r+=.2;x.fillStyle=p.c;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);x.restore()});
    if(++f<120)requestAnimationFrame(a);else x.clearRect(0,0,c.width,c.height);
  })();
  toast('🎉 Everything done! Amazing work!');
}

/* ===== notebook: page flip, tabs, swipe, keys ===== */
let flipping=false;
function flip(dir,fn){
  const p=$('page');
  if(flipping){fn();return}
  flipping=true;p.className='page '+(dir>0?'out-next':'out-prev');
  setTimeout(()=>{fn();p.className='page '+(dir>0?'in-next':'in-prev');setTimeout(()=>{p.className='page';flipping=false},460)},dir>0?380:200);
}
function goTo(d){
  const t=new Date(d);t.setHours(0,0,0,0);
  if(dayKey(t)===dayKey(current))return;
  flip(t>current?1:-1,()=>{current=t;render()});
}
const mon=d=>{const m=new Date(d);m.setHours(0,0,0,0);m.setDate(m.getDate()-((m.getDay()+6)%7));return dayKey(m)};
function renderTabs(){
  const w=view!=='daily',defs=w?[['Last week',-7],['This week',0],['Next week',7]]:[['Yesterday',-1],['Today',0],['Tomorrow',1]];
  const box=$('tabs');box.innerHTML='';
  defs.forEach(([lb,off])=>{
    const t=new Date();t.setDate(t.getDate()+off);
    const on=w?mon(t)===mon(current):dayKey(t)===dayKey(current);
    const b=document.createElement('button');b.className='tab'+(on?' active':'');b.textContent=lb;
    b.onclick=()=>{if(w){const x=new Date(t);x.setHours(0,0,0,0);if(mon(x)!==mon(current))flip(x>current?1:-1,()=>{current=x;render()})}else goTo(t)};
    box.appendChild(b);
  });
}
let sx=0,sy=0;
$('page').addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
$('page').addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>100&&Math.abs(dy)<60&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))step(dx<0?1:-1)});
document.addEventListener('keydown',e=>{if(/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)||$('modalBg').classList.contains('show'))return;if(e.key==='ArrowRight')step(1);if(e.key==='ArrowLeft')step(-1)});
document.querySelectorAll('.card h3').forEach(h=>{if(!h.closest('.progress'))h.onclick=()=>h.parentElement.classList.toggle('closed')});

/* ===== paper style, meals, affirmations ===== */
const papers=['ruled','dotted','grid'];let paper=0;
try{paper=Math.max(0,papers.indexOf(localStorage.getItem('planify_paper')))}catch(e){}
function setPaper(){$('page').dataset.paper=papers[paper];$('paperBtn').textContent='Paper: '+papers[paper];try{localStorage.setItem('planify_paper',papers[paper])}catch(e){}}
$('paperBtn').onclick=()=>{paper=(paper+1)%3;setPaper()};setPaper();
['b','l','d'].forEach(m=>$('meal_'+m).oninput=e=>{getData(dayKey(current)).meals[m]=e.target.value;save()});
const AFF=['You are doing better than you think 🌸','Small steps still move you forward ✨','Rest is productive too 🌙','Today is a fresh page 📖','Be gentle with yourself 💗','You can do hard things 🌷','Progress, not perfection 🍓','You deserve good things 🎀'];
let ai=new Date().getDate()%AFF.length;const showAff=()=>$('affirm').textContent=AFF[ai];showAff();
$('affBtn').onclick=()=>{ai=(ai+1)%AFF.length;showAff()};

/* ===== study planner ===== */
const COL=['#ee8fb5','#f4c97a','#c9a0dc','#8fcfb8','#f6a38c','#8fb8e8'];
const fmt=d=>d.toLocaleDateString('en-US',{month:'short',day:'numeric'});
const addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
function study(){const s=state._study||(state._study={});s.subs=s.subs||[];s.set=s.set||{wake:7,start:16,sleep:23,hours:4};s.log=s.log||{};s.goals=s.goals||{};return s}
const daysLeft=(x,from)=>x.exam?Math.round((new Date(x.exam+'T00:00')-from)/864e5):null;
function addLog(m){const s=study(),k=dayKey(new Date());s.log[k]=(s.log[k]||0)+m;toast('+'+m+' min logged 📖');save();if(view==='study')render()}
function clearPlan(){const ws=weekStart();for(let i=0;i<7;i++){const d=getData(dayKey(addD(ws,i)));Object.keys(d.events).forEach(h=>{if(d.events[h].ai)delete d.events[h]})}}
function buildPlan(){
  const s=study(),st=s.set,t0=new Date();t0.setHours(0,0,0,0);const ws=weekStart();
  clearPlan();const planned=new Set();let count=0;
  const first=Math.max(6,st.start,st.wake+1),last=Math.min(22,st.sleep-1);
  for(let i=0;i<7;i++){
    const date=addD(ws,i);if(date<t0)continue;
    const d=getData(dayKey(date));
    const pool=s.subs.map((x,si)=>({x,si,left:daysLeft(x,date),pend:x.topics.map((t,ti)=>({t,ti})).filter(o=>!o.t.d&&!planned.has(si+'-'+o.ti))})).filter(o=>o.pend.length&&(o.left===null||o.left>=0));
    pool.forEach(o=>o.score=o.pend.length/Math.max(1,(o.left===null?30:o.left)+1));
    let n=0,h=first;
    while(n<st.hours&&h<=last){
      if(d.events[h]){h++;continue}
      pool.sort((a,b)=>b.score-a.score);
      const o=pool.find(p=>p.pend.length);if(!o)break;
      const tp=o.pend.shift();planned.add(o.si+'-'+tp.ti);
      d.events[h]={text:'📚 '+o.x.name+': '+tp.t.t,cat:'study',ai:true};
      o.score*=.6;n++;count++;h++;if(n%2===0)h++;
    }
  }
  toast(count?count+' study sessions planned ✨':'Add subjects and topics first');render();
}
function renderStudy(){
  const s=study(),t0=new Date();t0.setHours(0,0,0,0);const ws=weekStart();
  $('dateLabel').textContent='Study week · '+fmt(ws)+' – '+fmt(addD(ws,6));
  const subs=s.subs.map((x,i)=>({x,i,left:daysLeft(x,t0),done:x.topics.filter(t=>t.d).length}));
  const nx=subs.filter(o=>o.left!==null&&o.left>=0).sort((a,b)=>a.left-b.left)[0];
  $('weekSummary').textContent=nx?'Next exam: '+nx.x.name+' in '+nx.left+' day'+(nx.left===1?'':'s'):'Add your subjects and exam dates to begin.';
  const cd=o=>o.left===null?'no date':o.left<0?'finished':o.left===0?'today!':o.left+' days';
  const sorted=[...subs].sort((a,b)=>(a.left===null)-(b.left===null)||a.left-b.left);
  const pct=o=>o.x.topics.length?Math.round(o.done/o.x.topics.length*100):0;
  const goals=s.goals[mon(current)]||[];
  const lg=[...Array(7)].map((_,i)=>{const d=addD(t0,i-6);return{l:'SMTWTFS'[d.getDay()],m:s.log[dayKey(d)]||0}});
  const wkMin=lg.reduce((a,b)=>a+b.m,0);
  $('studyView').innerHTML=`<div class="col">
  <div class="card"><h3>⏳ Exam countdown</h3>${sorted.length?sorted.map(o=>`<div class="cdrow"><div class="top"><em style="color:${COL[o.i%6]};font-style:normal">●</em><span>${esc(o.x.name)}</span><b class="cd ${o.left!==null&&o.left>=0&&o.left<=7?'hot':''}">${cd(o)}</b></div><div class="bar"><i style="width:${pct(o)}%"></i></div></div>`).join(''):'<div class="empty">No subjects yet — add one below ✨</div>'}</div>
  <div class="card"><h3>📚 Subjects & syllabus</h3>
    <div class="add-row"><input id="sName" placeholder="subject (e.g. Physics)"><input id="sExam" type="date"><button class="go" data-a="addSub">+</button></div>
    ${subs.map(o=>`<div class="subj" style="--c:${COL[o.i%6]}"><h4><span>${esc(o.x.name)}</span><small>${o.x.exam?fmt(new Date(o.x.exam+'T00:00'))+' · ':''}${o.done}/${o.x.topics.length} topics</small><button class="btn" data-a="delSub" data-i="${o.i}">🗑️</button></h4>
    ${o.x.topics.map((t,j)=>`<div class="item"><input type="checkbox" data-c="topic" data-i="${o.i}" data-j="${j}" ${t.d?'checked':''}><span class="txt">${esc(t.t)}</span><button class="btn" data-a="delTopic" data-i="${o.i}" data-j="${j}">✕</button></div>`).join('')}
    <div class="add-row"><input id="t_${o.i}" placeholder="add topics (comma separated)"><button class="go" data-a="addTopic" data-i="${o.i}">+</button></div></div>`).join('')}
  </div></div>
  <div class="col">
  <div class="card"><h3>🌙 Sleep & study settings</h3><div class="set">
    <label>Wake up (hour)<input type="number" min="0" max="23" data-s="wake" value="${s.set.wake}"></label>
    <label>Start studying at<input type="number" min="0" max="23" data-s="start" value="${s.set.start}"></label>
    <label>Bedtime (hour)<input type="number" min="0" max="23" data-s="sleep" value="${s.set.sleep}"></label>
    <label>Study hours / day<input type="number" min="1" max="12" data-s="hours" value="${s.set.hours}"></label></div>
    <p class="hint">Use the 24-hour clock: 7 = 7 AM, 16 = 4 PM, 23 = 11 PM.</p></div>
  <div class="card sticky"><h3>✨ Smart weekly plan</h3>
    <p class="hint">Fills this week's hourly schedule with your unfinished topics. Subjects with closer exams and more topics left get more slots, with a break after every 2 hours. Sessions stay inside your study hours and your own events are never overwritten.</p>
    <div class="btn-row" style="justify-content:flex-start"><button class="go" data-a="build">Build my week</button><button class="chip" data-a="clear">Clear plan</button></div></div>
  <div class="card"><h3>⏱️ Study log <small>${(wkMin/60).toFixed(1)} h in 7 days</small></h3>
    <div class="hint">Finished focus timers (25 min) are added automatically. Add time by hand:</div>
    <div class="filters"><button class="chip" data-a="log" data-i="15">+15 min</button><button class="chip" data-a="log" data-i="30">+30 min</button><button class="chip" data-a="log" data-i="60">+1 hour</button></div>
    <div class="logbars">${lg.map(x=>`<div><i style="height:${Math.min(100,x.m/240*100)}%" title="${x.m} min"></i>${x.l}</div>`).join('')}</div></div>
  <div class="card"><h3>🎯 Weekly goals</h3>
    ${goals.length?goals.map((g,i)=>`<div class="item"><input type="checkbox" data-c="goal" data-i="${i}" ${g.done?'checked':''}><span class="txt">${esc(g.text)}</span><button class="btn" data-a="delGoal" data-i="${i}">🗑️</button></div>`).join(''):'<div class="empty">What do you want to achieve this week?</div>'}
    <div class="add-row"><input id="gIn" placeholder="add a goal..."><button class="go" data-a="addGoal">+</button></div></div>
  </div>`;
}
$('studyView').addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b)return;
  const s=study(),a=b.dataset.a,i=+b.dataset.i,j=+b.dataset.j,v=id=>$(id)?$(id).value.trim():'';
  if(a==='addSub'){const n=v('sName');if(!n)return toast('Enter a subject name first');s.subs.push({name:n,exam:v('sExam'),topics:[]})}
  else if(a==='delSub'){if(!confirm('Delete this subject?'))return;s.subs.splice(i,1)}
  else if(a==='addTopic')v('t_'+i).split(/[,\n]/).map(x=>x.trim()).filter(Boolean).forEach(t=>s.subs[i].topics.push({t,d:false}));
  else if(a==='delTopic')s.subs[i].topics.splice(j,1);
  else if(a==='build')return buildPlan();
  else if(a==='clear'){clearPlan();toast('Plan cleared')}
  else if(a==='log')return addLog(i);
  else if(a==='addGoal'){const g=v('gIn');if(!g)return;(s.goals[mon(current)]=s.goals[mon(current)]||[]).push({text:g,done:false})}
  else if(a==='delGoal')s.goals[mon(current)].splice(i,1);
  render();
});
$('studyView').addEventListener('change',e=>{
  const t=e.target,s=study(),i=+t.dataset.i,j=+t.dataset.j;
  if(t.dataset.s){s.set[t.dataset.s]=Math.min(23,Math.max(0,Math.round(+t.value)||0));render()}
  else if(t.dataset.c==='topic'){s.subs[i].topics[j].d=t.checked;render()}
  else if(t.dataset.c==='goal'){s.goals[mon(current)][i].done=t.checked;render()}
});
$('studyView').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.tagName==='INPUT'){const b=e.target.parentElement.querySelector('[data-a]');if(b)b.click()}});

/* ===== init ===== */
render();
setInterval(()=>{if(view==='daily')renderTimeline()},60000);
</script>
</body>
</html>
